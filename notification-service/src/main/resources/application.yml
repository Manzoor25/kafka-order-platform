spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/notification_db}
    username: ${DB_USER:notification_user}
    password: ${DB_PASSWORD:notification_pass}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8085}

platform:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081/apis/registry/v3}
    topic-partitions: ${TOPIC_PARTITIONS:6}
    topic-replicas: ${TOPIC_REPLICAS:3}
    topic-min-insync-replicas: ${TOPIC_MIN_ISR:2}
    consumer-group-protocol: ${KAFKA_GROUP_PROTOCOL:consumer}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
