name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Schema Gate & Testcontainers Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Enforce Avro BACKWARD compatibility & verify breaking schema rejection
        run: bash scripts/demo-schema-evolution.sh

      - name: Run unit tests, service Testcontainers ITs, and 5-service E2E saga tests
        run: ./mvnw -B -ntp verify

      - name: Upload Surefire & Failsafe test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            **/target/surefire-reports/*.txt
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.txt
            **/target/failsafe-reports/*.xml

  docker-compose-failure-demos:
    name: 3-Broker KRaft Compose & Failure Demos
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Boot 3-broker Kafka 4.4.0 KRaft stack (make up)
        run: make up

      - name: Run Happy-Path Saga & 5-Service Jaeger Trace Verification (make demo)
        run: make demo

      - name: Run KIP-848 Consumer Scaling Demo 1 -> 3 (make demo-scale-kip848)
        run: make demo-scale-kip848

      - name: "Failure Demo 1: Kill Kafka Broker Under Load (make demo-kill-broker)"
        run: make demo-kill-broker

      - name: "Failure Demo 2: Kill Payment Service Mid-Transaction (make demo-kill-payment)"
        run: make demo-kill-payment

      - name: "Failure Demo 3: Poison Message -> DLT -> CLI Replay (make demo-poison-dlt)"
        run: make demo-poison-dlt

      - name: "Failure Demo 4: Payment Declined & Saga Compensation (make demo-payment-declined)"
        run: make demo-payment-declined

      - name: Dump container logs if any demo failed
        if: failure()
        run: docker compose logs --tail=150

      - name: Tear down stack cleanly (make down)
        if: always()
        run: make down
