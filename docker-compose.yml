x-kafka-common: &kafka-common
  CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "BROKER"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "12"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: "12"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_NUM_PARTITIONS: "6"
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: "classic,consumer"
  KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"

services:
  # ===========================================================================
  # 3-Broker Apache Kafka 4.4.0 KRaft Cluster (Combined Broker + Controller)
  # ===========================================================================
  kafka-1:
    image: apache/kafka:4.4.0
    container_name: kop-kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: "BROKER://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "BROKER://kafka-1:19092,EXTERNAL://localhost:9092"
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  kafka-2:
    image: apache/kafka:4.4.0
    container_name: kop-kafka-2
    hostname: kafka-2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: "BROKER://0.0.0.0:19092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "BROKER://kafka-2:19092,EXTERNAL://localhost:9093"
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  kafka-3:
    image: apache/kafka:4.4.0
    container_name: kop-kafka-3
    hostname: kafka-3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-common
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: "BROKER://0.0.0.0:19092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "BROKER://kafka-3:19092,EXTERNAL://localhost:9094"
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ===========================================================================
  # Schema Registry (Apicurio Registry 3.3.4 with Avro & ccompat v7)
  # ===========================================================================
  schema-registry:
    image: apicurio/apicurio-registry:3.3.4
    container_name: kop-schema-registry
    ports:
      - "8081:8080"
    environment:
      QUARKUS_HTTP_PORT: "8080"
      APICURIO_COMPATIBILITY_BACKWARD_TRANSITIVE: "false"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/apis/registry/v3/system/info >/dev/null 2>&1 || wget -qO- http://localhost:8080/apis/registry/v3/system/info >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ===========================================================================
  # Observability & Cluster UI (Jaeger 2.23.0 OTLP + Kafbat Kafka UI v1.5.0)
  # ===========================================================================
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    container_name: kop-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ >/dev/null 2>&1 || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 15

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kop-kafka-ui
    ports:
      - "8086:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "order-platform-kraft"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:19092,kafka-2:19092,kafka-3:19092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8080/apis/ccompat/v7"
    depends_on:
      kafka-1:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  # ===========================================================================
  # Dedicated PostgreSQL 17.11 Databases (Strictly Isolated DB-per-Service)
  # ===========================================================================
  order-db:
    image: postgres:17.11-alpine
    container_name: kop-order-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 3s
      timeout: 3s
      retries: 15

  payment-db:
    image: postgres:17.11-alpine
    container_name: kop-payment-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 3s
      timeout: 3s
      retries: 15

  inventory-db:
    image: postgres:17.11-alpine
    container_name: kop-inventory-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 3s
      timeout: 3s
      retries: 15

  shipping-db:
    image: postgres:17.11-alpine
    container_name: kop-shipping-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: shipping_db
      POSTGRES_USER: shipping_user
      POSTGRES_PASSWORD: shipping_pass
    volumes:
      - shipping_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping_user -d shipping_db"]
      interval: 3s
      timeout: 3s
      retries: 15

  notification-db:
    image: postgres:17.11-alpine
    container_name: kop-notification-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 3s
      timeout: 3s
      retries: 15

  # ===========================================================================
  # 5 Event-Driven Microservices (Zero Inter-Service HTTP)
  # ===========================================================================
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: order-service
    container_name: kop-order-service
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: "jdbc:postgresql://order-db:5432/order_db"
      DB_USER: "order_user"
      DB_PASSWORD: "order_pass"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19092,kafka-3:19092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8080/apis/registry/v3"
      KAFKA_GROUP_PROTOCOL: "consumer"
      TOPIC_PARTITIONS: "6"
      TOPIC_REPLICAS: "3"
      TOPIC_MIN_ISR: "2"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://jaeger:4318/v1/traces"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_SCHEDULE_DELAY: "500ms"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      order-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: payment-service
    container_name: kop-payment-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      DB_URL: "jdbc:postgresql://payment-db:5432/payment_db"
      DB_USER: "payment_user"
      DB_PASSWORD: "payment_pass"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19092,kafka-3:19092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8080/apis/registry/v3"
      KAFKA_GROUP_PROTOCOL: "consumer"
      KAFKA_TX_ID_PREFIX: "payment-eos-tx-node1-"
      PAYMENT_MID_TX_HOLD_MS: "12000"
      TOPIC_PARTITIONS: "6"
      TOPIC_REPLICAS: "3"
      TOPIC_MIN_ISR: "2"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://jaeger:4318/v1/traces"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_SCHEDULE_DELAY: "500ms"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      payment-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  # Note: No fixed container_name or host port so `docker compose up -d --scale inventory-service=3`
  # scales seamlessly from 1 -> 3 instances under KIP-848 (`group.protocol=consumer`).
  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: inventory-service
    expose:
      - "8083"
    environment:
      SERVER_PORT: "8083"
      DB_URL: "jdbc:postgresql://inventory-db:5432/inventory_db"
      DB_USER: "inventory_user"
      DB_PASSWORD: "inventory_pass"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19092,kafka-3:19092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8080/apis/registry/v3"
      KAFKA_GROUP_PROTOCOL: "consumer"
      TOPIC_PARTITIONS: "6"
      TOPIC_REPLICAS: "3"
      TOPIC_MIN_ISR: "2"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://jaeger:4318/v1/traces"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_SCHEDULE_DELAY: "500ms"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  shipping-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: shipping-service
    expose:
      - "8084"
    environment:
      SERVER_PORT: "8084"
      DB_URL: "jdbc:postgresql://shipping-db:5432/shipping_db"
      DB_USER: "shipping_user"
      DB_PASSWORD: "shipping_pass"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19092,kafka-3:19092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8080/apis/registry/v3"
      KAFKA_GROUP_PROTOCOL: "consumer"
      SHIPPING_RETRY_INITIAL_MS: "1000"
      SHIPPING_RETRY_MULTIPLIER: "2.0"
      SHIPPING_RETRY_MAX_MS: "4000"
      TOPIC_PARTITIONS: "6"
      TOPIC_REPLICAS: "3"
      TOPIC_MIN_ISR: "2"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://jaeger:4318/v1/traces"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_SCHEDULE_DELAY: "500ms"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      shipping-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: notification-service
    container_name: kop-notification-service
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: "8085"
      DB_URL: "jdbc:postgresql://notification-db:5432/notification_db"
      DB_USER: "notification_user"
      DB_PASSWORD: "notification_pass"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19092,kafka-3:19092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8080/apis/registry/v3"
      KAFKA_GROUP_PROTOCOL: "consumer"
      TOPIC_PARTITIONS: "6"
      TOPIC_REPLICAS: "3"
      TOPIC_MIN_ISR: "2"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://jaeger:4318/v1/traces"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_SCHEDULE_DELAY: "500ms"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      notification-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  # ===========================================================================
  # Dead-Letter Queue Inspector & Replay CLI (On-Demand Tool Profile)
  # ===========================================================================
  dlq-cli:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: dlq-cli
    profiles:
      - tools
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:19092,kafka-2:19092,kafka-3:19092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8080/apis/registry/v3"

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  order_db_data:
  payment_db_data:
  inventory_db_data:
  shipping_db_data:
  notification_db_data:
